  html, body { margin: 0; background: transparent; }
  /* Opened on its own: preview it on the hero's Midnight background */
  html.rx-standalone { background: #1a2138; }
  html.rx-standalone body { padding: 48px; }
  html.rx-standalone .rx-preview { max-width: 620px; margin: 0 auto; }

  /* Design canvas is 1000 x 680; every size below is in canvas units so the whole
     composition scales as one piece with the iframe width */
  .rx-preview {
    container-type: inline-size;
    width: 100%;
    font-family: Inter, -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .rx-stage { --u: calc(100cqw / 1000); position: relative; width: 100%; aspect-ratio: 1000 / 680; }

  .rx-window {
    position: absolute;
    left: 0; top: calc(24 * var(--u));
    width: calc(880 * var(--u));
    border-radius: calc(22 * var(--u));
    overflow: hidden;
    background: #f8f9fb;
    border: 1px solid rgba(251, 250, 247, 0.22);
  }
  .rx-bar {
    height: calc(56 * var(--u));
    display: flex; align-items: center;
    gap: calc(9 * var(--u));
    padding: 0 calc(24 * var(--u));
    background: #f1f2f5;
    border-bottom: 1px solid #e3e6ec;
  }
  .rx-dot { width: calc(13 * var(--u)); height: calc(13 * var(--u)); border-radius: 50%; background: #d9dce3; flex: none; }
  .rx-bar-title {
    margin-left: calc(18 * var(--u));
    font-size: calc(17 * var(--u));
    font-weight: 600;
    letter-spacing: 0.14em;
    color: #8d96a6;
  }
  .rx-window img { display: block; width: 100%; height: auto; aspect-ratio: 1600 / 1016; }

  .rx-panel {
    position: absolute;
    left: calc(650 * var(--u)); top: calc(64 * var(--u));
    width: calc(350 * var(--u));
    border-radius: calc(18 * var(--u));
    overflow: hidden;
    background: #fbfaf6;
    border: 1px solid #e3e6ec;
    box-shadow: calc(-12 * var(--u)) calc(16 * var(--u)) calc(40 * var(--u)) rgba(26, 33, 56, 0.28);
  }
  .rx-panel img { display: block; width: 100%; height: auto; aspect-ratio: 1002 / 1600; }

  /* One calm entrance: the window settles in, then the risk detail slides across */
  @keyframes rxRise  { from { opacity: 0; transform: translateY(calc(18 * var(--u))); } to { opacity: 1; transform: none; } }
  @keyframes rxSlide { from { opacity: 0; transform: translateX(calc(32 * var(--u))); } to { opacity: 1; transform: none; } }
  .rx-window { animation: rxRise 0.8s cubic-bezier(.2,.8,.2,1) 0.1s both; }
  .rx-panel  { animation: rxSlide 0.8s cubic-bezier(.2,.8,.2,1) 0.55s both; }
  @media (prefers-reduced-motion: reduce) { .rx-window, .rx-panel { animation: none; } }
</style>
</head>
